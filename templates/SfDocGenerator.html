<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salesforce Document Generator</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: linear-gradient(135deg, #0176d3, #00a1e0);
            min-height: 100vh;
        }
        .glass-card {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }
        .img-glow {
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
        .astro-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%   { transform: translateY(0px); }
            50%  { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .url-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 999px;
            padding: 4px 12px 4px 8px;
            font-size: 0.78rem;
            font-family: monospace;
            word-break: break-all;
            transition: background 0.2s;
        }
        .url-tag:hover { background: rgba(255,255,255,0.25); }
        .url-remove {
            cursor: pointer;
            color: #fca5a5;
            font-size: 1rem;
            line-height: 1;
            flex-shrink: 0;
        }
        .url-remove:hover { color: #f87171; }

        /* Section visibility */
        .prompt-section { display: none; }
        .prompt-section.active { display: block; }
    </style>
</head>

<body class="flex items-center justify-center p-6">

    <!-- Astro Mascot -->
    <div class="fixed top-10 right-10 w-32 astro-float hidden lg:block">
        <img src="https://www.salesforce.com/content/dam/sfdc-docs/www/en_us/icons/astro-head.svg" alt="Astro" class="img-glow">
    </div>

    <div class="glass-card w-full max-w-5xl rounded-3xl p-8 text-white">

        <!-- Header -->
        <div class="text-center mb-8 relative">
            <div class="flex justify-center mb-4">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/f9/Salesforce.com_logo.svg" alt="Salesforce Logo" class="h-16 bg-white p-2 rounded-xl img-glow">
            </div>
            <h1 class="text-5xl font-bold mb-3 tracking-tight">Document Generator</h1>
            <p class="text-lg text-slate-100">Upload your prompt file and generate Salesforce concept documentation instantly.</p>
        </div>

        <!-- Styled Prompt Type Selector -->
        <div class="mb-8">
            <p class="text-center text-sm font-semibold text-slate-200 uppercase tracking-widest mb-4">Select a Prompt Type</p>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="promptTypeCards">

                <button type="button" onclick="handlePromptType('UploadPrompt')"
                    data-type="UploadPrompt"
                    class="prompt-type-card group flex flex-col items-center gap-3 p-5 rounded-2xl border-2 border-white/20 bg-white/10 hover:bg-white/20 hover:border-white/50 transition-all duration-200 cursor-pointer text-white">
                    <div class="w-12 h-12 rounded-xl bg-white/20 group-hover:bg-white/30 flex items-center justify-center transition text-2xl">📁</div>
                    <span class="font-semibold text-base">Upload Prompt</span>
                    <span class="text-xs text-slate-300 text-center leading-snug">Use a .txt file as your prompt source</span>
                </button>

                <button type="button" onclick="handlePromptType('WebsiteReference')"
                    data-type="WebsiteReference"
                    class="prompt-type-card group flex flex-col items-center gap-3 p-5 rounded-2xl border-2 border-white/20 bg-white/10 hover:bg-white/20 hover:border-white/50 transition-all duration-200 cursor-pointer text-white">
                    <div class="w-12 h-12 rounded-xl bg-white/20 group-hover:bg-white/30 flex items-center justify-center transition text-2xl">🌐</div>
                    <span class="font-semibold text-base">Website Reference</span>
                    <span class="text-xs text-slate-300 text-center leading-snug">Paste content and URLs from the web</span>
                </button>

                <button type="button" onclick="handlePromptType('SalesforceTopic')"
                    data-type="SalesforceTopic"
                    class="prompt-type-card group flex flex-col items-center gap-3 p-5 rounded-2xl border-2 border-white/20 bg-white/10 hover:bg-white/20 hover:border-white/50 transition-all duration-200 cursor-pointer text-white">
                    <div class="w-12 h-12 rounded-xl bg-white/20 group-hover:bg-white/30 flex items-center justify-center transition text-2xl">⚡</div>
                    <span class="font-semibold text-base">Salesforce Topic</span>
                    <span class="text-xs text-slate-300 text-center leading-snug">Type a Salesforce concept to document</span>
                </button>

            </div>
        </div>

        <style>
            .prompt-type-card.selected {
                border-color: #fff !important;
                background: rgba(255,255,255,0.25) !important;
                box-shadow: 0 0 0 3px rgba(255,255,255,0.15);
            }
            .prompt-type-card.selected .card-icon {
                background: rgba(255,255,255,0.35) !important;
            }
        </style>

        <!-- FORM wraps only the dynamic sections + submit -->
        <form action="/generate-sf-doc" method="POST" onsubmit="syncHiddenFields()">

            <!-- ── Section: Upload Prompt ───────────────────────────── -->
            <div id="section-UploadPrompt" class="prompt-section">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

                    <!-- Upload -->
                    <div class="bg-white/10 rounded-2xl p-6 border border-white/5">
                        <h2 class="text-2xl font-semibold mb-4 flex items-center gap-2">
                            <span>📁</span> Upload Prompt
                        </h2>
                        <label
                            for="fileInput"
                            class="group border-2 border-dashed border-white/40 rounded-2xl h-60 flex flex-col items-center justify-center cursor-pointer hover:bg-white/10 transition duration-300"
                        >
                            <div class="mb-4 transform group-hover:scale-110 transition duration-300">
                                <img src="https://www.salesforce.com/content/dam/sfdc-docs/www/en_us/icons/standard-objects/file_120.png" alt="File Icon" class="w-20 img-glow">
                            </div>
                            <p class="text-lg font-medium group-hover:text-blue-200 transition">Click to Upload TXT File</p>
                            <p class="text-sm text-slate-200 mt-2">Supported format: .txt</p>
                            <input type="file" id="fileInput" accept=".txt" class="hidden" onchange="handleFile(this)" />
                        </label>
                        <div id="fileName" class="mt-4 text-sm text-center font-mono text-blue-200 bg-blue-900/30 rounded py-1 px-2 hidden"></div>
                    </div>

                    <!-- Preview -->
                    <div class="bg-white/10 rounded-2xl p-6 border border-white/5">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-2xl font-semibold flex items-center gap-2">
                                <span>👁️</span> Preview
                            </h2>
                            <button
                                type="button"
                                onclick="clearPrompt()"
                                class="bg-red-500/80 hover:bg-red-600 px-4 py-2 rounded-lg text-sm font-medium transition"
                            >
                                Clear
                            </button>
                        </div>
                        <textarea
                            id="promptBox"
                            name="prompt_content"
                            placeholder="Your Salesforce prompt content will appear here..."
                            class="w-full h-64 bg-white/20 border border-white/20 rounded-2xl p-4 text-white placeholder-slate-300 outline-none resize-none focus:ring-2 focus:ring-blue-300 transition"
                        ></textarea>
                    </div>

                </div>
            </div>

            <!-- ── Section: Website Reference ──────────────────────── -->
            <div id="section-WebsiteReference" class="prompt-section">
                <div class="bg-white/10 rounded-2xl p-6 border border-white/5">
                    <h2 class="text-2xl font-semibold mb-4 flex items-center gap-2">
                        <span>🌐</span> Website Reference
                    </h2>

                    <label class="text-sm text-slate-200 mb-1 font-medium block">Reference Content</label>
                    <textarea
                        id="websiteContent"
                        placeholder="Paste any reference content from a website here..."
                        class="w-full h-32 bg-white/20 border border-white/20 rounded-2xl p-4 text-white placeholder-slate-300 outline-none resize-none focus:ring-2 focus:ring-blue-300 transition mb-4"
                    ></textarea>

                    <label class="text-sm text-slate-200 mb-1 font-medium block">Website URL(s)</label>
                    <div class="flex gap-2 mb-3">
                        <input
                            type="url"
                            id="urlInput"
                            placeholder="https://developer.salesforce.com/..."
                            class="flex-1 min-w-0 bg-white/20 border border-white/20 rounded-xl px-4 py-2 text-white placeholder-slate-300 outline-none focus:ring-2 focus:ring-blue-300 transition text-sm"
                            onkeydown="if(event.key==='Enter'){event.preventDefault();addUrl();}"
                        />
                        <button
                            type="button"
                            onclick="addUrl()"
                            class="bg-blue-500/80 hover:bg-blue-600 px-4 py-2 rounded-xl text-sm font-semibold transition whitespace-nowrap"
                        >
                            + Add
                        </button>
                    </div>
                    <div id="urlTagList" class="flex flex-col gap-2 overflow-y-auto max-h-28 pr-1"></div>

                    <!-- Hidden fields synced on submit -->
                    <input type="hidden" id="websiteContentHidden" name="website_content">
                    <input type="hidden" id="websiteUrlsHidden"    name="website_urls">
                </div>
            </div>

            <!-- ── Section: Salesforce Topic ───────────────────────── -->
            <div id="section-SalesforceTopic" class="prompt-section">
                <div class="bg-white/10 rounded-2xl p-6 border border-white/5">
                    <h2 class="text-2xl font-semibold mb-4">
                        <span>⚡</span> Salesforce Topic
                    </h2>
                    <input
                        type="text"
                        name="topic"
                        id="topicInput"
                        placeholder="Example: Apex Triggers..."
                        class="w-full bg-white/20 border border-white/20 rounded-xl p-4 text-white placeholder-slate-300 outline-none focus:ring-2 focus:ring-blue-300 transition"
                    />
                </div>
            </div>

            <!-- Hidden shared fields -->
            <input type="hidden" name="storage_path"  value="./output_docs">
            <input type="hidden" name="prompt_type"   id="promptTypeHidden">

            <!-- Submit — only shown when a type is selected -->
            <div id="submitBtn" class="mt-8 text-center hidden">
                <button
                    type="submit"
                    class="bg-white text-blue-700 hover:bg-slate-100 px-10 py-4 rounded-2xl text-lg font-bold shadow-xl transition"
                >
                    Generate Document
                </button>
            </div>

        </form>
    </div>

    <script>
        // ── Prompt type switcher ─────────────────────────────────────
        function handlePromptType(value) {
            // Hide all sections
            document.querySelectorAll('.prompt-section').forEach(el => el.classList.remove('active'));

            // Show the matching section (if any)
            if (value) {
                const target = document.getElementById('section-' + value);
                if (target) target.classList.add('active');
            }

            // Highlight selected card, deselect others
            document.querySelectorAll('.prompt-type-card').forEach(card => {
                card.classList.toggle('selected', card.dataset.type === value);
            });

            // Show/hide submit button
            document.getElementById('submitBtn').classList.toggle('hidden', !value);

            // Keep hidden field in sync
            document.getElementById('promptTypeHidden').value = value;
        }

        // ── File upload ──────────────────────────────────────────────
        function handleFile(input) {
            const file = input.files[0];
            if (!file) return;
            const nameEl = document.getElementById('fileName');
            nameEl.textContent = '📄 ' + file.name;
            nameEl.classList.remove('hidden');
            const reader = new FileReader();
            reader.onload = e => { document.getElementById('promptBox').value = e.target.result; };
            reader.readAsText(file);
        }

        function clearPrompt() {
            document.getElementById('promptBox').value = '';
            document.getElementById('fileInput').value = '';
            const nameEl = document.getElementById('fileName');
            nameEl.textContent = '';
            nameEl.classList.add('hidden');
        }

        // ── URL tag management ───────────────────────────────────────
        let urlList = [];

        function addUrl() {
            const input = document.getElementById('urlInput');
            const raw   = input.value.trim();
            if (!raw) return;
            try { new URL(raw); } catch {
                input.style.borderColor = '#f87171';
                setTimeout(() => input.style.borderColor = '', 1500);
                return;
            }
            if (urlList.includes(raw)) { input.value = ''; return; }
            urlList.push(raw);
            input.value = '';
            renderUrlTags();
        }

        function removeUrl(index) {
            urlList.splice(index, 1);
            renderUrlTags();
        }

        function renderUrlTags() {
            const container = document.getElementById('urlTagList');
            container.innerHTML = '';
            urlList.forEach((url, i) => {
                const tag = document.createElement('div');
                tag.className = 'url-tag';
                tag.innerHTML = `
                    <span class="text-blue-200">🔗</span>
                    <span class="flex-1 truncate" title="${url}">${url}</span>
                    <span class="url-remove" onclick="removeUrl(${i})">✕</span>
                `;
                container.appendChild(tag);
            });
            document.getElementById('websiteUrlsHidden').value = urlList.join(',');
        }

        // ── Sync fields before submit ────────────────────────────────
        function syncHiddenFields() {
            const wc = document.getElementById('websiteContent');
            if (wc) document.getElementById('websiteContentHidden').value = wc.value;
            document.getElementById('websiteUrlsHidden').value = urlList.join(',');
        }
    </script>

</body>
</html>
