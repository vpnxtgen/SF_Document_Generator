<script>
    function getActiveBrainstormRequest(documentId, invitationId) {
        const feedbackUrlString = window['lucidConfigure']['documentServiceHost'] + "/documents/" + documentId + "/feedbackState/activeBrainstormSession";
        const feedbackUrl = new URL(feedbackUrlString);

        const headers = new Headers({'Content-Type': 'application/json', 'Cache-Control': 'no-cache'});
        if (invitationId) {
            headers.append('X-Lucid-Document-Invitation-Id', invitationId);
        }
        

        

        return fetch(feedbackUrl, {
            method: "GET",
            headers: headers,
            credentials: "include",
            cache: "no-cache",
        })
            .then((response) => {
                if (response.ok) {
                    return response.json();
                } else {
                    const message = `Failed to load active private mode session. Status: ${response.status} ${response.statusText}.`;
                    if (typeof bootstrapJsErrorLogger !== 'undefined') {
                        bootstrapJsErrorLogger.log(new Error(message))
                    }
                    console.error(message);
                    return undefined;
                }
            })
            .catch((error) => {
                const message = `Failed to load active private mode session.`;
                if (typeof bootstrapJsErrorLogger !== 'undefined') {
                    bootstrapJsErrorLogger.log(new Error(message))
                }
                console.error(message, error);
                return undefined;
            });
    }
</script>

    
        
<script>
    function getInvitationId() {
        const invitationQueryParam = window.location.search.substring(1)
        .split('&')
        .map(entry => entry.split('='))
        .find(([key, value]) => key == 'invitationId');
        return (invitationQueryParam && invitationQueryParam.length >= 2 && invitationQueryParam[1]) || undefined;
    }
</script>
